<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sudoku</title>
    <script>
      // GitHub Pages has no SPA fallback: stash the requested URL and bounce to the app
      // root (the first path segment is the repo name), where index.html restores it.
      var base = '/' + location.pathname.split('/')[1] + '/'
      sessionStorage.setItem('spa-redirect', location.pathname + location.search + location.hash)
      location.replace(base)
    </script>
  </head>
</html>
