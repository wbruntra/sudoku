<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/sudoku/favicon.svg" />
    <link rel="icon" sizes="48x48" href="/sudoku/favicon.ico" />
    <link rel="apple-touch-icon" href="/sudoku/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sudoku</title>
    <meta
      name="description"
      content="Play Sudoku in your browser with pencil marks, multi-cell selection, and generated puzzles at every difficulty."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,400..500&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Restore the deep link saved by 404.html before the router reads the URL.
      ;(function () {
        var url = sessionStorage.getItem('spa-redirect')
        if (url) {
          sessionStorage.removeItem('spa-redirect')
          history.replaceState(null, '', url)
        }
      })()
    </script>
    <script>
      // Applied before paint so the selected theme doesn't flash on load.
      ;(function () {
        var stored = localStorage.getItem('scaffold-theme')
        var theme = stored
        if (theme !== 'dark' && theme !== 'light' && theme !== 'solarized') {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
    <script type="module" crossorigin src="/sudoku/assets/index-DYCXbwdF.js"></script>
    <link rel="stylesheet" crossorigin href="/sudoku/assets/index-CFxy0Hh1.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
